<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">
    <title>档案知识闯关</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <!-- 登录页面 -->
    <div id="login-page" class="page">
        <div class="login-container">
            <div class="logo">📚</div>
            <h1 class="title">山西工商学院<br>档案知识闯关</h1>
            <p class="subtitle">请填写个人信息开始游戏</p>
            
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="name">姓名</label>
                    <input type="text" id="name" class="form-input" placeholder="请输入姓名" required>
                </div>
                
                <div class="form-group">
                    <label for="major">专业</label>
                    <input type="text" id="major" class="form-input" placeholder="请输入专业" required>
                </div>
                
                <div class="form-group">
                    <label for="grade">年级</label>
                    <select id="grade" class="form-input" required>
                        <option value="">请选择年级</option>
                        <option value="2022">2022级</option>
                        <option value="2023">2023级</option>
                        <option value="2024">2024级</option>
                        <option value="2025">2025级</option>
                        <option value="2026">2026级</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="student-id">学号</label>
                    <input type="text" id="student-id" class="form-input" placeholder="请输入学号" required>
                </div>
                
                <button type="submit" class="btn btn-primary">开始闯关</button>
            </form>
        </div>
    </div>

    <!-- 开始页面 -->
    <div id="start-page" class="page hidden">
        <div class="start-container">
            <div class="logo">📚</div>
            <h1 class="title">山西工商学院<br>档案知识闯关</h1>
            <p class="subtitle">庆祝建校40周年 · 2026</p>
            <div class="game-info">
                <div class="info-item">
                    <span class="icon">📝</span>
                    <span>25道精选题目</span>
                </div>
                <div class="info-item">
                    <span class="icon">⏱️</span>
                    <span>限时150秒</span>
                </div>
                <div class="info-item">
                    <span class="icon">🏆</span>
                    <span>闯关模式</span>
                </div>
            </div>
            <button id="start-btn" class="btn btn-primary">开始闯关</button>
            <div class="category-select">
                <h3>选择题目类型</h3>
                <div class="category-buttons">
                    <button class="category-btn active" data-category="all">全部（100题）</button>
                    <button class="category-btn" data-category="laws">📜 法律法规</button>
                    <button class="category-btn" data-category="process">📋 毕业流程</button>
                    <button class="category-btn" data-category="history">🏛️ 校史知识</button>
                    <button class="category-btn" data-category="archives">📁 档案管理</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 答题页面 -->
    <div id="game-page" class="page hidden">
        <div class="game-header">
            <div class="game-header-top">
                <button id="back-to-start-btn" class="back-btn">← 返回</button>
                <div class="game-stats">
                    <span class="stat">题目: <span id="current-question">1</span>/<span id="total-questions">20</span></span>
                    <span class="stat">得分: <span id="score">0</span></span>
                    <span class="stat timer">⏱️ <span id="timer">60</span>s</span>
                </div>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>
        <div class="question-container">
            <div class="question-category" id="question-category">全部题目</div>
            <h2 class="question-text" id="question-text">题目将在这里显示</h2>
            <div class="options-container" id="options-container">
                <!-- 选项将通过JS动态生成 -->
            </div>
            <div class="feedback" id="feedback"></div>
        </div>
        <div class="game-footer">
            <button id="next-btn" class="btn btn-secondary hidden">下一题</button>
        </div>
    </div>

    <!-- 结果页面 -->
    <div id="result-page" class="page hidden">
        <div class="result-container">
            <div class="result-icon" id="result-icon">🎉</div>
            <h1 class="result-title" id="result-title">恭喜通关!</h1>
            <div class="result-stats">
                <div class="stat-item">
                    <span class="stat-label">最终得分</span>
                    <span class="stat-value" id="final-score">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">答对题数</span>
                    <span class="stat-value" id="correct-count">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">正确率</span>
                    <span class="stat-value" id="accuracy">0%</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">用时</span>
                    <span class="stat-value" id="time-used">60s</span>
                </div>
            </div>
            <div class="result-message" id="result-message"></div>
            <div class="result-actions">
                <button id="restart-btn" class="btn btn-primary">再玩一次</button>
                <button id="share-btn" class="btn btn-secondary">分享成绩</button>
            </div>
        </div>
    </div>

    <!-- 分享图片模板（隐藏） -->
    <div id="share-template" style="display: none;">
        <div id="share-card" style="width: 600px; height: 900px; background: linear-gradient(180deg, #667eea, #764ba2); padding: 30px; font-family: 'Microsoft YaHei', sans-serif;">
            <div style="background: white; border-radius: 20px; padding: 30px; height: 100%; box-sizing: border-box;">
                <!-- 标题区域 -->
                <div style="text-align: center; margin-bottom: 25px;">
                    <div style="font-size: 50px; margin-bottom: 15px;">📚</div>
                    <h1 style="font-size: 28px; color: #1a1a2e; margin: 0 0 8px 0; font-weight: bold;">山西工商学院</h1>
                    <h2 style="font-size: 22px; color: #666; margin: 0;">档案知识闯关</h2>
                </div>
                
                <!-- 个人信息 -->
                <div style="background: #f8f9fa; border-radius: 15px; padding: 20px; margin-bottom: 20px;">
                    <div style="font-size: 16px; color: #333; font-weight: bold; margin-bottom: 15px; text-align: center;">📝 个人信息</div>
                    <div style="display: flex; justify-content: space-around; text-align: center;">
                        <div style="flex: 1;">
                            <div style="font-size: 13px; color: #8b8b9e; margin-bottom: 5px;">姓名</div>
                            <div id="share-name" style="font-size: 16px; color: #2d3436; font-weight: bold; word-break: break-all; max-width: 100px;">-</div>
                        </div>
                        <div style="flex: 1;">
                            <div style="font-size: 13px; color: #8b8b9e; margin-bottom: 5px;">专业</div>
                            <div id="share-major" style="font-size: 16px; color: #2d3436; font-weight: bold; word-break: break-all; max-width: 100px;">-</div>
                        </div>
                        <div style="flex: 1;">
                            <div style="font-size: 13px; color: #8b8b9e; margin-bottom: 5px;">年级</div>
                            <div id="share-grade" style="font-size: 16px; color: #2d3436; font-weight: bold;">-</div>
                        </div>
                        <div style="flex: 1;">
                            <div style="font-size: 13px; color: #8b8b9e; margin-bottom: 5px;">学号</div>
                            <div id="share-student-id" style="font-size: 16px; color: #2d3436; font-weight: bold; word-break: break-all; max-width: 100px;">-</div>
                        </div>
                    </div>
                </div>
                
                <!-- 成绩区域 -->
                <div style="background: #f8f9fa; border-radius: 15px; padding: 20px; margin-bottom: 20px;">
                    <div style="font-size: 16px; color: #333; font-weight: bold; margin-bottom: 15px; text-align: center;">🏆 游戏成绩</div>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;">
                        <div style="background: linear-gradient(135deg, #2ed573, #1e90ff); padding: 18px; border-radius: 12px; text-align: center;">
                            <div style="font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 8px;">最终得分</div>
                            <div id="share-score" style="font-size: 32px; color: white; font-weight: bold;">0</div>
                        </div>
                        <div style="background: linear-gradient(135deg, #f39c12, #e74c3c); padding: 18px; border-radius: 12px; text-align: center;">
                            <div style="font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 8px;">正确率</div>
                            <div id="share-accuracy" style="font-size: 32px; color: white; font-weight: bold;">0%</div>
                        </div>
                        <div style="background: linear-gradient(135deg, #667eea, #764ba2); padding: 18px; border-radius: 12px; text-align: center;">
                            <div style="font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 8px;">答对题数</div>
                            <div id="share-correct" style="font-size: 32px; color: white; font-weight: bold;">0</div>
                        </div>
                        <div style="background: linear-gradient(135deg, #00cec9, #0984e3); padding: 18px; border-radius: 12px; text-align: center;">
                            <div style="font-size: 13px; color: rgba(255,255,255,0.9); margin-bottom: 8px;">用时</div>
                            <div id="share-time" style="font-size: 32px; color: white; font-weight: bold;">0s</div>
                        </div>
                    </div>
                </div>
                
                <!-- 二维码区域 -->
                <div style="text-align: center;">
                    <div id="share-qrcode" style="display: inline-block; background: white; padding: 10px; border-radius: 10px; border: 2px solid #eee;"></div>
                    <div style="margin-top: 12px; font-size: 13px; color: #666;">扫描上方二维码参与挑战</div>
                    <div style="margin-top: 5px; font-size: 12px; color: #999;">计算机信息工程学院</div>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
